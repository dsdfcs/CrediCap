[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credicap"
version = "1.0.0"
description = "Credibility-aware image-caption evaluation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "tqdm",
  "Pillow",
  "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["credicap*"]
